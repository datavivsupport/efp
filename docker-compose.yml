services:
  efp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. Set these in a .env file next to
        # this compose file, or export them before `docker compose build`.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
    image: efp-web:latest
    container_name: efp-web
    ports:
      - "${APP_PORT:-3001}:80"
    restart: unless-stopped
